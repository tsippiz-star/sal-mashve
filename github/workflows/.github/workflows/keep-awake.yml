name: שמירה על האתר ער

# Streamlit Community Cloud מרדים אתר שלא נכנסו אליו זמן מה, ומציג "Zzzz… get this app back up".
# הבדיקה הזו נכנסת לאתר כל 4 שעות עם דפדפן אמיתי, ואם הוא ישן — לוחצת על כפתור ההערה.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: התקנת דפדפן
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: כניסה לאתר והערה אם צריך
        env:
          APP_URL: https://sal-mashve.streamlit.app/
        run: |
          python - <<'EOF'
          import asyncio, os
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  pg = await b.new_page()
                  await pg.goto(os.environ["APP_URL"], wait_until="domcontentloaded", timeout=90000)
                  await pg.wait_for_timeout(8000)
                  btn = pg.get_by_role("button", name="Yes, get this app back up!")
                  if await btn.count():
                      print("האתר ישן — מעירים אותו…")
                      await btn.first.click()
                  for i in range(36):                      # עד 3 דקות
                      await pg.wait_for_timeout(5000)
                      for f in pg.frames:
                          if "/~/+/" in f.url:
                              try:
                                  if await f.locator("text=הרשימה שלי").count():
                                      print(f"✅ האתר ער ({(i + 1) * 5} שניות)")
                                      await b.close()
                                      return
                              except Exception:
                                  pass
                  print("⚠️ האתר לא נטען בזמן — ננסה שוב בריצה הבאה")
                  await b.close()

          asyncio.run(main())
          EOF
